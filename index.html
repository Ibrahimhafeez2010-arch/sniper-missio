<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniper Mission</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">
        <div id="hud">
            <div>MISSION 1</div>
            <div id="status">READY</div>
        </div>

        <div id="target"></div>

        <div id="scope">
            <div class="crosshair horizontal"></div>
            <div class="crosshair vertical"></div>
            <div class="scope-circle"></div>
        </div>

        <div id="message">
            <h1>SNIPER MISSION</h1>
            <p>Right-click and hold to aim</p>
            <p>Left-click to fire</p>
            <button id="startButton">START MISSION</button>
        </div>
    </div>

    <script src="game.js"></script>

</body>
</html>
